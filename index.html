<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AIM MASTER - 8-Bit Quick Draw</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="cabinet">
        <canvas id="game-canvas" width="240" height="272"></canvas>

        <!-- Title Start Overlay -->
        <div id="title-overlay" class="overlay-panel">
          <button id="start-btn" type="button" class="arcade-btn primary-btn">
            START GAME
          </button>
        </div>

        <!-- Result Overlay Modal -->
        <div id="result-overlay" class="overlay-panel result-panel hidden">
          <h2 id="result-heading" class="result-title">STAGE CLEAR!</h2>
          <p id="result-timestamp" class="result-timestamp"></p>
          <img
            id="result-card-img"
            class="result-card-preview"
            alt="Aim Master Result Card"
          />
          <div class="result-actions">
            <button id="share-btn" type="button" class="arcade-btn share-btn">
              SHARE RESULT
            </button>
            <button id="retry-btn" type="button" class="arcade-btn primary-btn">
              PLAY AGAIN
            </button>
          </div>
        </div>
      </div>

      <div class="side-dock">
        <!-- Shared Options Panel (Visible ONLY in TITLE & RESULT screens) -->
        <section id="options-panel" class="options-panel" aria-label="Play Options">
          <div class="options-header">OPTIONS</div>
          <div class="options-row">
            <label for="sensitivity-slider" class="options-label">
              SENSITIVITY <span id="sensitivity-value" class="options-val">6.0</span>
            </label>
            <input
              id="sensitivity-slider"
              type="range"
              min="2.0"
              max="14.0"
              step="0.5"
              value="6.0"
              class="retro-slider"
            />
          </div>
          <div class="options-toggles">
            <button id="invert-x-btn" type="button" class="toggle-btn" aria-pressed="false">
              REVERSE X: OFF
            </button>
            <button id="invert-y-btn" type="button" class="toggle-btn" aria-pressed="false">
              REVERSE Y: OFF
            </button>
          </div>
        </section>

        <div class="controls-bar">
          <button id="reset-center-btn" type="button" class="reset-btn">
            [ RESET CENTER ]
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
