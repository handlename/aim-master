<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AIM MASTER - 8-Bit Quick Draw</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="cabinet">
        <canvas id="game-canvas" width="240" height="400"></canvas>

        <!-- Title Start Overlay Button -->
        <div id="title-overlay" class="overlay-panel">
          <button id="start-btn" type="button" class="arcade-btn primary-btn">
            START GAME
          </button>
          <p class="hint-text">
            スマホを地面と垂直・正面に構えてタップ！<br />
            (PCではマウス/タッチ移動で操作できます)
          </p>
        </div>

        <!-- Result Overlay Modal -->
        <div id="result-overlay" class="overlay-panel result-panel hidden">
          <h2 id="result-heading" class="result-title">STAGE CLEAR!</h2>
          <img
            id="result-card-img"
            class="result-card-preview"
            alt="Aim Master Result Card"
          />
          <div class="result-actions">
            <button id="share-btn" type="button" class="arcade-btn share-btn">
              SHARE RESULT
            </button>
            <a
              id="download-link"
              class="arcade-btn secondary-btn"
              download="aim-master-result.png"
            >
              SAVE IMAGE
            </a>
          </div>
          <button id="retry-btn" type="button" class="arcade-btn primary-btn">
            PLAY AGAIN
          </button>
        </div>
      </div>

      <div class="controls-bar">
        <button id="reset-center-btn" type="button" class="reset-btn">
          [ RESET CENTER / 正面リセット ]
        </button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
